# Self-contained test configuration (shadows src/main/resources/application.yml): no config-server, no Eureka,
# H2 instead of MySQL. Kafka tests start an embedded broker and override spring.kafka.bootstrap-servers.
spring:
  application:
    name: notification-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:philips_notification;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      missing-topics-fatal: false
      concurrency: 1

eureka:
  client:
    enabled: false

app:
  kafka:
    topic:
      partitions: 3
      replicas: 1
    retry:
      # Fast retries so the DLT path completes in well under a second in tests
      interval-ms: 50
      max-attempts: 2
  notification:
    recipient-domain: example.com
    sender-address: no-reply@philips-shop.example

logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    org.apache.zookeeper: WARN
    state.change.logger: WARN
