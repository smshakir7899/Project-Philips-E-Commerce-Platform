# Bootstrap-only settings. Routes, timeouts, CORS, Resilience4j and Swagger UI live in config-repo/api-gateway.yml.
server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      # Refuse to start without configuration (routes!) instead of silently starting with none.
      fail-fast: true
      retry:
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 10000
        max-attempts: 20
