# Self-contained test configuration: shadows src/main/resources/application.yml, needs no config-server,
# Eureka, MySQL or Kafka broker. Feign/Resilience4j settings mirror config-repo/cart-service.yml
# (with shorter timeouts) so the WireMock test exercises the real resilience behaviour.
server:
  port: 0

spring:
  application:
    name: cart-service
  cloud:
    config:
      enabled: false
  datasource:
    # unique name per Spring context: cached contexts (slices, @SpringBootTest) must not share one in-memory DB
    url: jdbc:h2:mem:cart-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      missing-topics-fatal: false

eureka:
  client:
    enabled: false

app:
  kafka:
    # No broker in these tests: do not start listener containers and do not ask KafkaAdmin to create topics.
    listener:
      auto-startup: false
    topic:
      auto-create: false
      partitions: 3
      replicas: 1
    retry:
      interval-ms: 100
      max-attempts: 3

feign:
  client:
    config:
      product-service:
        connect-timeout: 1000
        read-timeout: 500
      inventory-service:
        connect-timeout: 1000
        read-timeout: 500

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.philips.ecommerce.common.exception.ResourceNotFoundException
          - com.philips.ecommerce.common.feign.RemoteServiceException
    instances:
      productService:
        base-config: default
      inventoryService:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 50ms
        retry-exceptions:
          - com.philips.ecommerce.common.exception.ServiceUnavailableException
        ignore-exceptions:
          - com.philips.ecommerce.common.exception.ResourceNotFoundException
          - com.philips.ecommerce.common.feign.RemoteServiceException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      productService:
        base-config: default
      inventoryService:
        base-config: default

logging:
  level:
    org.apache.kafka: WARN
