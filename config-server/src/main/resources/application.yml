server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # "native" = read files from the local file system / classpath instead of a Git repository.
    # In production you would typically use a Git backend (versioned, auditable, PR-reviewed config).
    active: native
  cloud:
    config:
      server:
        native:
          # Comma-separated list, searched in order. The two relative defaults make it work both when started from
          # the repository root (./config-repo) and from the module directory (../config-repo, e.g. in IDE runs
          # and unit tests). Docker Compose mounts the directory and sets CONFIG_REPO_LOCATION=file:/config-repo/.
          # The trailing slash matters: without it Spring treats the location as a file, not a directory.
          search-locations: ${CONFIG_REPO_LOCATION:file:./config-repo/,file:../config-repo/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.config: INFO
