# =============================================================================================
# SonarQube configuration for the standalone CLI scanner (sonar-scanner) - an ALTERNATIVE.
# The PRIMARY path is the Maven plugin (./mvnw sonar:sonar, used by the Jenkinsfile), which reads
# the <sonar.*> properties from the root pom.xml and ignores this file. Keep both in sync.
#
# Usage (after ./mvnw -B clean verify so classes and JaCoCo XML reports exist):
#   docker run --rm --network philips-net -v "$PWD:/usr/src" \
#     -e SONAR_HOST_URL=http://sonarqube:9000 -e SONAR_TOKEN="$SONAR_TOKEN" sonarsource/sonar-scanner-cli
# The token is passed via the SONAR_TOKEN environment variable - NEVER put it in this file.
# =============================================================================================

sonar.projectKey=philips-ecommerce
sonar.projectName=Philips E-Commerce Platform
sonar.projectVersion=1.0.0-SNAPSHOT
sonar.sourceEncoding=UTF-8

# Java 8 source level: rules that suggest Java 9+ APIs are not raised.
sonar.java.source=8

# One SonarQube "module" per Maven module; each inherits the settings below and resolves
# relative paths against its own directory.
sonar.modules=common-lib,config-server,discovery-server,api-gateway,product-service,inventory-service,cart-service,order-service,payment-service,notification-service

# Defaults applied to every module (paths relative to the module base dir). The scanner FAILS
# if a listed directory does not exist: for a module without tests add e.g.
#   config-server.sonar.tests=
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
# Optional, improves type resolution: ./mvnw dependency:copy-dependencies first
sonar.java.libraries=target/dependency/*.jar
sonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Same exclusions as the pom: boilerplate without logic is neither analysed nor counted for coverage.
sonar.exclusions=**/*Application.java,**/config/**,**/dto/**,**/entity/**,**/event/**
sonar.coverage.exclusions=**/*Application.java,**/config/**,**/dto/**,**/entity/**,**/event/**,**/exception/*Exception.java
# Flyway SQL and generated files are not duplicated logic
sonar.cpd.exclusions=**/db/migration/**

# Per-module base directories (module key = directory name)
common-lib.sonar.projectBaseDir=common-lib
common-lib.sonar.projectName=common-lib
config-server.sonar.projectBaseDir=config-server
config-server.sonar.projectName=config-server
discovery-server.sonar.projectBaseDir=discovery-server
discovery-server.sonar.projectName=discovery-server
api-gateway.sonar.projectBaseDir=api-gateway
api-gateway.sonar.projectName=api-gateway
product-service.sonar.projectBaseDir=product-service
product-service.sonar.projectName=product-service
inventory-service.sonar.projectBaseDir=inventory-service
inventory-service.sonar.projectName=inventory-service
cart-service.sonar.projectBaseDir=cart-service
cart-service.sonar.projectName=cart-service
order-service.sonar.projectBaseDir=order-service
order-service.sonar.projectName=order-service
payment-service.sonar.projectBaseDir=payment-service
payment-service.sonar.projectName=payment-service
notification-service.sonar.projectBaseDir=notification-service
notification-service.sonar.projectName=notification-service
