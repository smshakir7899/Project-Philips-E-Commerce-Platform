# Self-contained test configuration: shadows src/main/resources/application.yml (no config-server, no Eureka,
# no MySQL, no Kafka broker). Integration tests override single properties (embedded Kafka, WireMock).
spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    loadbalancer:
      cache:
        enabled: false
  datasource:
    # Random name: every Spring test context gets its own in-memory database.
    url: jdbc:h2:mem:order-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    enabled: false

feign:
  client:
    config:
      default:
        connect-timeout: 1000
        read-timeout: 2000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        record-failure-predicate: com.philips.ecommerce.order.client.RemoteCallFailurePredicate
    instances:
      cart-service:
        base-config: default
      product-service:
        base-config: default
      inventory-service:
        base-config: default
      payment-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 50ms
        retry-exceptions:
          - feign.RetryableException
        ignore-exceptions:
          - com.philips.ecommerce.common.feign.RemoteServiceException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
    instances:
      cart-service:
        base-config: default
      product-service:
        base-config: default
      inventory-service:
        base-config: default
      payment-service:
        base-config: default

app:
  outbox:
    enabled: false
    fetch-mode: SIMPLE
    poll-interval-ms: 200
    max-attempts: 10
  kafka:
    topic:
      partitions: 3
      replicas: 1

logging:
  level:
    com.philips.ecommerce: DEBUG
    org.apache.kafka: WARN
    kafka: WARN
    org.apache.zookeeper: WARN
