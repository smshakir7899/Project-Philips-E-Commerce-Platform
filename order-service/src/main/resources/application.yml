# Only bootstrap settings live here; everything else is served by config-server
# (config-repo/application.yml + config-repo/order-service.yml).
server:
  port: 8084

spring:
  application:
    name: order-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000
        max-attempts: 20
